<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 15 850 370" width="100%" height="100%">
  <defs>
    <!-- Import Google Font: Quicksand -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap');
    </style>

    <!-- Pure White Gradients / Soft Metallic White -->
    <linearGradient id="whiteLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E9ECEF"/>
    </linearGradient>

    <linearGradient id="whiteMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEE2E6"/>
      <stop offset="50%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#CED4DA"/>
    </linearGradient>

    <!-- Soft Drop Shadow for White on Transparent/Dark Background -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= LEFT SIDE: LOGO EMBLEM (Transparent Background) ================= -->
  <g transform="translate(-40, 0)">
    <!-- Background Decorative Rings -->
    <circle cx="310" cy="210" r="170" fill="none" stroke="url(#whiteLight)" stroke-width="1" opacity="0.35"/>
    <circle cx="310" cy="210" r="150" fill="none" stroke="url(#whiteLight)" stroke-width="1" stroke-dasharray="4 6" opacity="0.45"/>

    <g transform="translate(10, -45)">
      <!-- Main Crest / Shield Container -->
      <g filter="url(#dropShadow)">
        <!-- Outer Shield Frame -->
        <path d="M 300 80 
                 C 355 80, 420 85, 435 140 
                 C 435 230, 385 310, 300 355 
                 C 215 310, 165 230, 165 140 
                 C 180 85, 245 80, 300 80 Z" 
              fill="none" 
              stroke="url(#whiteLight)" 
              stroke-width="4.5" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>

        <!-- Inner Shield Frame -->
        <path d="M 300 90 
                 C 348 90, 407 94, 420 142 
                 C 420 221, 375 291, 300 333 
                 C 225 291, 180 221, 180 142 
                 C 193 94, 252 90, 300 90 Z" 
              fill="#FFFFFF" 
              fill-opacity="0.15"
              stroke="url(#whiteMid)" 
              stroke-width="1.5"/>
      </g>

      <!-- FORTRESS / CASTLE EMBLEM -->
      <g id="fortress" filter="url(#dropShadow)">
        <!-- Fort Base Foundation -->
        <path d="M 215 275 L 385 275 L 375 290 L 225 290 Z" fill="url(#whiteLight)" />
        
        <!-- Main Fort Wall -->
        <path d="M 225 270 L 375 270 L 370 210 L 230 210 Z" fill="url(#whiteMid)"/>
        
        <!-- Wall Texture / Shadow lines -->
        <path d="M 300 210 L 300 270 M 265 210 L 265 270 M 335 210 L 335 270" stroke="#CED4DA" stroke-width="1.5" opacity="0.6"/>
        <path d="M 230 240 L 370 240" stroke="#CED4DA" stroke-width="1.5" opacity="0.6"/>

        <!-- Central Archway / Fort Entrance -->
        <path d="M 285 270 L 285 240 C 285 230, 315 230, 315 240 L 315 270 Z" fill="#343A40" stroke="url(#whiteLight)" stroke-width="1.5"/>

        <!-- Left Tower -->
        <path d="M 215 270 L 240 270 L 242 170 L 213 170 Z" fill="url(#whiteLight)"/>
        <!-- Left Tower Crenellations -->
        <path d="M 210 170 L 210 160 L 220 160 L 220 165 L 226 165 L 226 160 L 233 160 L 233 165 L 239 165 L 239 160 L 245 160 L 245 170 Z" fill="url(#whiteLight)"/>
        <!-- Left Tower Window Slot -->
        <rect x="224" y="185" width="7" height="16" rx="3.5" fill="#343A40"/>

        <!-- Right Tower -->
        <path d="M 360 270 L 385 270 L 387 170 L 358 170 Z" fill="url(#whiteLight)"/>
        <!-- Right Tower Crenellations -->
        <path d="M 355 170 L 355 160 L 362 160 L 362 165 L 368 165 L 368 160 L 375 160 L 375 165 L 381 165 L 381 160 L 390 160 L 390 170 Z" fill="url(#whiteLight)"/>
        <!-- Right Tower Window Slot -->
        <rect x="369" y="185" width="7" height="16" rx="3.5" fill="#343A40"/>

        <!-- Center Grand Tower -->
        <path d="M 260 210 L 340 210 L 335 145 L 265 145 Z" fill="url(#whiteLight)"/>
        <!-- Center Tower Battlements -->
        <path d="M 262 145 L 262 133 L 274 133 L 274 139 L 286 139 L 286 133 L 298 133 L 298 139 L 302 139 L 302 133 L 314 133 L 314 139 L 326 139 L 326 133 L 338 133 L 338 145 Z" fill="url(#whiteLight)"/>
        
        <!-- Center Tower Windows -->
        <path d="M 278 175 C 278 168, 288 168, 288 175 L 288 195 L 278 195 Z" fill="#343A40"/>
        <path d="M 312 175 C 312 168, 322 168, 322 175 L 322 195 L 312 195 Z" fill="#343A40"/>

        <!-- Central Turret Roof / Spire -->
        <path d="M 300 95 L 320 133 L 280 133 Z" fill="url(#whiteLight)"/>
        <!-- Flag Pole & Banner -->
        <line x1="300" y1="95" x2="300" y2="78" stroke="url(#whiteLight)" stroke-width="2"/>
        <path d="M 300 78 L 318 84 L 300 90 Z" fill="url(#whiteLight)"/>
      </g>

      <!-- 5 Stars (Luxury Hotel Indicator) -->
      <g id="stars" fill="url(#whiteLight)">
        <!-- Center Star -->
        <path d="M 300 355 L 303.2 362 L 310 362.7 L 304.7 367.5 L 306.3 374.5 L 300 370.7 L 293.7 374.5 L 295.3 367.5 L 290 362.7 L 296.8 362 Z" />
        <!-- Inner Left Star -->
        <path d="M 272 358 L 274.5 363.4 L 280.8 364 L 276 368 L 277.4 374 L 272 370.8 L 266.6 374 L 268 368 L 263.2 364 L 269.5 363.4 Z" transform="rotate(-8, 272, 366)"/>
        <!-- Inner Right Star -->
        <path d="M 328 358 L 330.5 363.4 L 336.8 364 L 332 368 L 333.4 374 L 328 370.8 L 322.6 374 L 324 368 L 319.2 364 L 325.5 363.4 Z" transform="rotate(8, 328, 366)"/>
        <!-- Outer Left Star -->
        <path d="M 245 365 L 247 369 L 251.5 369.4 L 248 372.5 L 249 377 L 245 374.5 L 241 377 L 242 372.5 L 238.5 369.4 L 243 369 Z" transform="rotate(-16, 245, 371)"/>
        <!-- Outer Right Star -->
        <path d="M 355 365 L 357 369 L 361.5 369.4 L 358 372.5 L 359 377 L 355 374.5 L 351 377 L 352 372.5 L 348.5 369.4 L 353 369 Z" transform="rotate(16, 355, 371)"/>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT SIDE: TYPOGRAPHY (Quicksand Font, Side-by-Side) ================= -->
  <g transform="translate(500, -20)">
    
    <!-- Main Hotel Name using Quicksand (Font size 47px) -->
    <text x="0" y="205" 
          font-family="'Quicksand', sans-serif" 
          font-size="47" 
          font-weight="700"
          letter-spacing="5" 
          fill="#FFFFFF"
          filter="url(#dropShadow)">
      THE FORTRESS
    </text>

    <!-- Subtitle / Category using Quicksand (Font size 25px) -->
    <text x="2" y="250" 
          font-family="'Quicksand', sans-serif" 
          font-size="25" 
          font-weight="600"
          letter-spacing="7" 
          fill="#E9ECEF"
          filter="url(#dropShadow)">
      RESORT &amp; SPA
    </text>

    <!-- Elegant Divider Element -->
    <g transform="translate(2, 285)" stroke="url(#whiteLight)" stroke-width="1.2">
      <line x1="0" y1="0" x2="80" y2="0"/>
      <circle cx="95" cy="0" r="2" fill="url(#whiteLight)" stroke="none"/>
      <circle cx="110" cy="0" r="2" fill="url(#whiteLight)" stroke="none"/>
      <line x1="125" y1="0" x2="205" y2="0"/>
    </g>

    <!-- Est. Footnote using Quicksand (Font size 23px) -->
    <text x="2" y="325" 
          font-family="'Quicksand', sans-serif" 
          font-size="23" 
          font-weight="600"
          letter-spacing="4" 
          fill="#CED4DA"
          filter="url(#dropShadow)">
      EST. 1912
    </text>
  </g>

</svg>
